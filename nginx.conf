# Content-versioned files can be cached permanently; mutable indexes revalidate with ETag.
map $uri $world_cache_control {
    default "no-cache";
    ~^/(assets|media|audio)/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;
    add_header Cache-Control $world_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /assets/ { try_files $uri =404; }
    location /media/ { try_files $uri =404; }
    location /audio/ { try_files $uri =404; }
    location ~* \.(json|geojson)$ { default_type application/json; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
